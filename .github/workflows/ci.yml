name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          AUTH_SECRET: "ci-secret-minimum-24-chars-placeholder-xxxxxx"
          # Unit tests are pure-function (no live DB). Must be a valid postgres:// URL so the
          # lazy postgres-js client parses without throwing; it is never actually connected to.
          DATABASE_URL: "postgres://ci:ci@127.0.0.1:5432/ci"

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Next build
        run: npm run build
        env:
          AUTH_SECRET: "ci-secret-minimum-24-chars-placeholder-xxxxxx"
          DATABASE_URL: "postgres://ci:ci@127.0.0.1:5432/ci"
          NEXT_PUBLIC_APP_URL: "https://linky.agentbuff.id"
          NEXT_TELEMETRY_DISABLED: "1"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Gating: dependency vulns of high/critical severity fail the build.
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev
      # Advisory: secret scanning runs but does not gate (avoids CI breakage on historical commits /
      # example-file false positives). Review its findings; promote to gating once history is clean.
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
