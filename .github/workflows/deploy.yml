name: Deploy

# Manual or tag-triggered deploy to the Hostinger VPS via SSH + docker compose.
# Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, (optional) VPS_PORT, DEPLOY_PATH.
# Deploy is intentionally gated (workflow_dispatch / tags) — not on every push to main.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Re-run quality gates before shipping.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH (docker compose pull + up + migrate)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/linky' }}

            # Remember the currently-deployed commit so we can roll the APP back if the new one is unhealthy.
            PREV_SHA=$(git rev-parse HEAD)
            echo "Current commit (rollback target): $PREV_SHA"

            git fetch --all --tags
            git checkout ${{ github.sha }}

            # --- Pre-migration backup: never lose data on an upgrade -------------------------------
            # Dump the dedicated linky_postgres DB before applying migrations. Uses the local socket
            # inside its own container (trust auth). Keeps the 14 most recent backups.
            mkdir -p backups
            TS=$(date +%Y%m%d-%H%M%S)
            BACKUP="backups/linky-${TS}.sql"
            docker exec linky_postgres pg_dump -U linky_user -d linky > "$BACKUP"
            echo "DB backup written: $BACKUP ($(wc -c < "$BACKUP") bytes)"
            ls -1t backups/linky-*.sql | tail -n +15 | xargs -r rm -f

            # --- Build + migrate (migrations are additive/idempotent) + start --------------------
            docker compose build linky
            docker compose run --rm linky npm run db:migrate
            docker compose up -d --no-deps linky

            # --- Smoke test the health endpoint (retry up to ~30s) -------------------------------
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:1709/api/health >/dev/null; then
                echo "healthy — deploy ${{ github.sha }} live"; exit 0
              fi
              sleep 2
            done

            # --- Rollback: bring the previous (known-good) app version back so the site stays up --
            echo "Healthcheck FAILED — rolling app back to $PREV_SHA"
            docker compose logs --tail=80 linky || true
            git checkout "$PREV_SHA"
            docker compose build linky
            docker compose up -d --no-deps linky
            echo "Rolled back to $PREV_SHA. If a bad migration is suspected, restore with: $BACKUP"
            exit 1
